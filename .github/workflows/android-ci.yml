name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Snapshot committed Room schemas
        run: |
          mkdir -p /tmp/committed-room-schemas
          cp -R app/schemas/. /tmp/committed-room-schemas/
      - name: Mobile unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Wear protocol and Wear unit tests
        run: gradle :wear-protocol:testDebugUnitTest :wear:testDebugUnitTest --stacktrace
      - name: Verify Room schema is committed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          expected_root = Path('/tmp/committed-room-schemas')
          actual_root = Path('app/schemas')
          expected = {p.relative_to(expected_root) for p in expected_root.rglob('*.json')}
          actual = {p.relative_to(actual_root) for p in actual_root.rglob('*.json')}
          if expected != actual:
              print('Room schema file set changed.')
              print('Missing from commit:', sorted(map(str, actual - expected)))
              print('No longer generated:', sorted(map(str, expected - actual)))
              sys.exit(1)

          mismatches = []
          for relative in sorted(expected, key=str):
              committed = json.loads((expected_root / relative).read_text())
              generated = json.loads((actual_root / relative).read_text())
              if committed != generated:
                  mismatches.append(str(relative))
          if mismatches:
              print('Generated Room schemas differ semantically from committed schemas:')
              print('\n'.join(mismatches))
              sys.exit(1)
          PY
      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-room-schema
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mobile API 35 connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Mobile lint
        run: gradle :app:lintDebug --stacktrace
      - name: Wear protocol and Wear lint
        run: gradle :wear-protocol:lintDebug :wear:lintDebug --stacktrace
      - name: Assemble mobile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Assemble mobile release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Assemble mobile release App Bundle
        run: gradle :app:bundleRelease --stacktrace
      - name: Assemble Wear debug APK
        run: gradle :wear:assembleDebug --stacktrace
      - name: Assemble Wear release APK
        run: gradle :wear:assembleRelease --stacktrace
      - name: Verify release artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          PHONE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          WEAR_APK="$(find wear/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          PHONE_AAB="app/build/outputs/bundle/release/app-release.aab"

          test -n "$PHONE_APK"
          test -n "$WEAR_APK"
          test -f "$PHONE_AAB"

          PHONE_BADGING="$("$AAPT2" dump badging "$PHONE_APK" | head -n 1)"
          WEAR_BADGING="$("$AAPT2" dump badging "$WEAR_APK" | head -n 1)"
          echo "$PHONE_BADGING" | grep -F "package: name='com.germanchoconta.gymtracker' versionCode='1' versionName='1.0.0-rc1'"
          echo "$WEAR_BADGING" | grep -F "package: name='com.germanchoconta.gymtracker' versionCode='10001' versionName='1.0.0-rc1'"

          if "$APKSIGNER" verify "$PHONE_APK"; then
            echo "Phone release APK unexpectedly contains a distribution signature."
            exit 1
          fi
          if "$APKSIGNER" verify "$WEAR_APK"; then
            echo "Wear release APK unexpectedly contains a distribution signature."
            exit 1
          fi

          {
            echo "release_candidate=1.0.0-rc1"
            echo "application_id=com.germanchoconta.gymtracker"
            echo "phone_version_code=1"
            echo "wear_version_code=10001"
            echo "phone_release_apk_signed=false"
            echo "wear_release_apk_signed=false"
            echo "phone_aab_signed=false"
            sha256sum "$PHONE_APK" "$WEAR_APK" "$PHONE_AAB"
          } > release-artifact-metadata.txt
      - name: Upload mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload mobile release APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload mobile release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload release artifact metadata
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-release-metadata
          path: release-artifact-metadata.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Wear debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Wear release APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  wear-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Wear OS connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          disable-animations: true
          script: gradle :wear:connectedDebugAndroidTest --stacktrace
